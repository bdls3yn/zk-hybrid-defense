# Integration project for Dissertation §3.3 (ZK-HHCF + ThreatDetector)
# Run from this folder:  forge test -vv
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["../lib"]
remappings = ["forge-std/=../lib/forge-std/src/", "v1/=../src/"]
allow_paths = [".."]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../python" }]

[fuzz]
runs = 1000

[rpc_endpoints]
sepolia = "${ALCHEMY_SEPOLIA_URL}"
